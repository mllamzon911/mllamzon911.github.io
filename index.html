const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
let booting = false, skipping = false;
const SPIN = "|/-\\";
const sleep = ms => new Promise(r => {
  const end = performance.now() + ms;
  (function check() { if (skipping || performance.now() >= end) r(); else setTimeout(check, 16); })();
});
function newLine(text = "") {
  const d = document.createElement("div");
  d.className = "line"; d.textContent = text;
  out.appendChild(d); scrollEnd();
  return d;
}
// "Label ...... |" spinning, then "Label ...... OK"
async function spinLine(label, result, ms) {
  const d = newLine(label);
  const start = performance.now(); let f = 0;
  while (!skipping && performance.now() - start < ms) {
    d.textContent = label + " " + SPIN[f++ % 4];
    await sleep(70);
  }
  d.textContent = label + " " + result;
}
// Progress bar that fills unevenly, like a real load
async function progress(label, ms, doneText) {
  if (REDUCE) { if (doneText) newLine(doneText); return; }
  const W = 20, d = newLine();
  let p = 0, f = 0;
  const avg = 60 / ms;
  while (p < 1 && !skipping) {
    const n = Math.round(p * W);
    d.textContent = `${label} ${SPIN[f++ % 4]} [${"█".repeat(n)}${"░".repeat(W - n)}] ${String(Math.round(p * 100)).padStart(3)}%`;
    scrollEnd();
    await sleep(60);
    p = Math.min(1, p + avg * (0.2 + Math.random() * 1.6));
  }
  d.textContent = doneText || `${label}   [${"█".repeat(W)}] 100%`;
}

function resolve(arg) {
  if (!arg) return cwd;
  arg = arg.replace(/\//g, "\\").replace(/^"|"$/g, "");
  let parts = /^[a-z]:/i.test(arg) ? [] : cwd.split("\\").filter(Boolean);
  if (/^[a-z]:/i.test(arg)) { parts = ["C:"]; arg = arg.slice(2); }
  if (arg.startsWith("\\")) parts = ["C:"];
  for (const p of arg.split("\\").filter(Boolean)) {
    if (p === ".") continue;
    if (p === "..") { if (parts.length > 1) parts.pop(); continue; }
    parts.push(p);
  }
  const path = parts.length === 1 ? "C:\\" : parts.join("\\");
  const key = Object.keys(fs).find(k => k.toLowerCase() === path.toLowerCase());
  return key || null;
}

// ---------- Run ----------
function run(raw) {
  const line = raw.trim();
  if (!line) return;
  // Support "cd.." / "cd\" style without a space, like real cmd
  const m = line.match(/^([a-z]+)(\.\.|\\.*|\.\s*$)?(?:\s+(.*))?$/i) || [null, line, "", ""];
  let name = (m[1] || "").toLowerCase();
  let args = (m[3] || "").trim();
  if (m[2] && (name === "cd" || name === "chdir")) args = m[2] + (args ? " " + args : "");
  if (/\/\?$/.test(line) && commands[name]) { commands.help(name); return; }
  const fn = commands[name];
  if (fn && !(m[2] && name !== "cd" && name !== "chdir" && name !== "echo")) return fn(args, line);
  // Typing a file name opens it, as Windows would
  if (findFile(line)) return commands.type(line);
  notRecognized(line.split(/\s+/)[0]);
  print();
}

function submit(cmdText) {
  print(prompt() + cmdText);
  if (cmdText.trim()) { history.push(cmdText); }
  hIdx = history.length;
  cli.value = "";
  const r = run(cmdText);
  if (r && r.then) {
    busy = true; showPrompt(false);
    r.then(() => { busy = false; showPrompt(true); render(); scrollEnd(); focusCli(); });
  } else if (!busy) render();
  scrollEnd();
  focusCli();
}

// Types a command into the prompt one key at a time, then runs it,
// so visitors who click see exactly what to type next time.
function typeOut(cmdText, done) {
  if (booting) { skipping = true; return; }
  if (busy) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { submit(cmdText); done && done(); return; }
  busy = true; cli.value = ""; render(); scrollEnd();
  let i = 0;
  (function step() {
    if (i < cmdText.length) {
      cli.value += cmdText[i++];
      cli.setSelectionRange(cli.value.length, cli.value.length);
      render();
      setTimeout(step, 45);
    } else {
      setTimeout(() => { busy = false; submit(cmdText); done && done(); }, 160);
    }
  })();
}

  [["LinkedIn", c.linkedin], ["GitHub", c.github], ["Website", c.website]].forEach(([label, href]) => {
    if (!href) return;
    const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = label;
    contactBox.append(a);
  });
})();
status.append(hint, contactBox);
fbar.appendChild(status);

function copyText(txt, btn, node) {
  const label = btn.textContent;
  const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = label; }, 1600); };
  const fallback = () => {
    try { const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    done("Press Ctrl+C");
  };
  try { navigator.clipboard.writeText(txt).then(() => done("Copied"), fallback); } catch (e) { fallback(); }
}

// ---------- Plain view ----------
const plain = $("plain"), win = document.querySelector(".win");
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function extLink(href, text) { const a = el("a", null, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
function buildPlain() {
  plain.innerHTML = "";
  const bar = el("div", "p-bar");
  const back = el("button", "p-back", "Back to terminal");
  back.type = "button"; back.id = "p-back";
  back.addEventListener("click", () => showPlain(false));
  bar.append(el("span", "p-path", RES + "\\resume.txt"), back);
  plain.append(bar);

  const sheet = el("article", "sheet");
  const head = el("header", "p-head");
  head.append(el("h1", null, RESUME.name), el("p", "p-sub", RESUME.title + (RESUME.location ? " · " + RESUME.location : "")));
  const c = RESUME.contact, row = el("div", "p-contacts");
  if (c.email) {
    const w = el("span", "p-email"), t = el("span", null, c.email), b = el("button", "copy", "Copy");
    b.type = "button"; b.addEventListener("click", () => copyText(c.email, b, t));
    w.append(t, b); row.append(w);
  }
  if (c.phone) row.append(el("span", null, c.phone));
  [["LinkedIn", c.linkedin], ["GitHub", c.github], ["Website", c.website]].forEach(([l, h]) => { if (h) row.append(extLink(h, l)); });
  head.append(row);
  sheet.append(head);

  const sec = title => { const s = el("section"), body = el("div"); s.append(el("h2", null, title), body); sheet.append(s); return body; };
  sec("Summary").append(el("p", null, RESUME.summary));

  const ex = sec("Experience");
  RESUME.experience.forEach(c => {
    const it = el("div", "item");
    it.append(el("h3", "p-company", c.company));
    if (c.place) it.append(el("div", "p-place", c.place));
    c.roles.forEach(r => {
      const role = el("div", "p-roleblock"), h = el("div", "item-head");
      h.append(el("span", "p-role", r.role), el("span", "when", r.dates));
      const ul = el("ul");
      r.bullets.forEach(b => ul.append(el("li", null, b)));
      role.append(h, ul);
      it.append(role);
    });
    ex.append(it);
  });

  const ed = sec("Education");
  RESUME.education.forEach(e => {
    const it = el("div", "item"), h = el("div", "item-head"), left = el("div");
    left.append(el("strong", null, e.school));
    h.append(left, el("span", "when", e.dates));
    it.append(h, el("div", null, e.degree));
    if (e.place) it.append(el("div", "p-place", e.place));
    if (e.notes) it.append(el("div", "p-place", e.notes));
    ed.append(it);
  });

  const dl = el("dl", "p-skills");
  Object.entries(RESUME.skills).forEach(([k, v]) => dl.append(el("dt", null, k), el("dd", null, v.join(", "))));
  sec("Skills").append(dl);

  const pr = HAS_PROJECTS ? sec("Projects") : null;
  RESUME.projects.forEach(p => {
    const it = el("div", "item"), h = el("div", "item-head"), left = el("div");
    left.append(el("strong", null, p.name));
    h.append(left);
    if (p.link) h.append(extLink(p.link, "View project"));
    it.append(h, el("div", null, p.desc), el("div", "p-place", "Built with " + p.tech));
    pr.append(it);
  });
  plain.append(sheet);
}
function showPlain(on) {
  plain.hidden = !on;
  win.hidden = on;
  if (on) { plain.scrollTop = 0; try { $("p-back").focus({ preventScroll: true }); } catch (e) {} }
  else { scrollEnd(); focusCli(); }
}
$("btn-plain").addEventListener("click", () => showPlain(true));

// ---------- Tab completion ----------
let tabState = null;
function complete() {
  const v = cli.value;
  if (!tabState) {
    const sp = v.lastIndexOf(" ");
    const head = sp >= 0 ? v.slice(0, sp + 1) : "";
    const frag = v.slice(sp + 1).toLowerCase();
    const pool = sp >= 0
      ? [...fs[cwd].dirs, ...Object.keys(fs[cwd].files)]
      : [...Object.keys(commands).filter(k => !HIDDEN.includes(k)), ...Object.keys(fs[cwd].files)];
    const matches = pool.filter(p => p.toLowerCase().startsWith(frag));
    if (!matches.length) return;
    tabState = { head, matches, i: 0 };
  } else {
    tabState.i = (tabState.i + 1) % tabState.matches.length;
  }
  cli.value = tabState.head + tabState.matches[tabState.i];
  cli.setSelectionRange(cli.value.length, cli.value.length);
  render();
}

// ---------- Input wiring ----------
function focusCli() { if (!busy) try { cli.focus({ preventScroll: true }); } catch (e) { cli.focus(); } }

cli.addEventListener("input", () => { tabState = null; render(); });
cli.addEventListener("keyup", render);
cli.addEventListener("select", render);
cli.addEventListener("keydown", e => {
  if (busy) { e.preventDefault(); return; }
  if (e.key !== "Tab") tabState = null;
  if (e.key === "Enter") { e.preventDefault(); submit(cli.value); }
  else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (hIdx > 0) { hIdx--; cli.value = history[hIdx]; cli.setSelectionRange(cli.value.length, cli.value.length); render(); }
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (hIdx < history.length - 1) { hIdx++; cli.value = history[hIdx]; }
    else { hIdx = history.length; cli.value = ""; }
    cli.setSelectionRange(cli.value.length, cli.value.length); render();
  } else if (e.key === "Tab") { e.preventDefault(); complete(); }
  else if (e.key === "Escape") { e.preventDefault(); cli.value = ""; render(); }
  else if (e.key === "c" && e.ctrlKey && cli.selectionStart === cli.selectionEnd) {
    e.preventDefault(); print(prompt() + cli.value + "^C"); cli.value = ""; render(); scrollEnd();
  }
  requestAnimationFrame(render);
});

document.addEventListener("keydown", e => {
  if (!plain.hidden) { if (e.key === "Escape") showPlain(false); return; }
  const fk = !e.ctrlKey && !e.altKey && !e.metaKey && FKEYS.find(f => f[0] === e.key);
  if (booting) { e.preventDefault(); skipping = true; return; }
  if (fk && !waitKey) { e.preventDefault(); typeOut(fk[2]); return; }
  if (waitKey && !["Shift","Control","Alt","Meta"].includes(e.key)) { e.preventDefault(); const k = waitKey; waitKey = null; k(); return; }
  if (!busy && document.activeElement !== cli && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1 && !e.target.closest?.(".cmdlink, a, button")) {
    focusCli();
  }
});
term.addEventListener("click", () => {
  if (booting) { skipping = true; return; }
  if (waitKey) { const k = waitKey; waitKey = null; k(); return; }
  const sel = window.getSelection();
  if (!sel || !sel.toString()) focusCli();
});

$("btn-close").addEventListener("click", () => { if (!busy) submit("exit"); });
$("btn-min").addEventListener("click", () => { if (!busy) submit("cls"); });
$("btn-max").addEventListener("click", () => {
  const w = document.querySelector(".win");
  w.style.maxWidth = w.style.maxWidth ? "" : "none";
  focusCli();
});

// ---------- Boot ----------
async function boot() {
  out.innerHTML = "";
  cwd = HOME; busy = true; waitKey = null;
  showPrompt(false);
  $("wintitle").textContent = "Command Prompt";
  const reduce = REDUCE;

  if (!reduce) {
    booting = true; skipping = false;
    const n = (k, one, many) => k + " " + (k === 1 ? one : many);
    const skillCount = Object.values(RESUME.skills).reduce((a, s) => a + s.length, 0);
    newLine("ResumeOS Boot Manager");
    newLine("Press any key or tap to skip.");
    newLine("");
    const steps = [
      ["Initializing console", "OK"],
      ["Mounting C:\\Users\\guest\\resume", "OK"],
      ["Reading about.txt", "OK"],
      ["Loading experience", n(ROLE_COUNT, "role", "roles")],
      ["Loading education", n(RESUME.education.length, "entry", "entries")],
      ["Loading skills", n(skillCount, "skill", "skills")],
      ...(HAS_PROJECTS ? [["Loading projects", n(RESUME.projects.length, "project", "projects")]] : []),
      ["Checking contact info", "OK"]
    ];
    for (const [label, result] of steps) {
      await spinLine(label.padEnd(34, ".") + " ", result, 160 + Math.random() * 220);
    }
    newLine("");
    await progress("Starting Command Prompt", 800);
    await sleep(300);
    out.innerHTML = "";
    booting = false; skipping = false;
  }

  const intro = [
    VERSION,
    "(c) " + now.getFullYear() + " " + RESUME.name + ". All rights reserved.",
    "",
    printBanner,
    [{ t: RESUME.title, cls: "bold" }],
    "",
    ["Welcome. Type ", { t: "help", cmd: "help" }, " for a list of commands, or use the shortcuts at the bottom."],
    ""
  ];
  if (reduce) { printAll(intro); finish(); return; }
  let i = 0;
  (function next() {
    if (i >= intro.length) { finish(); return; }
    print(intro[i++]); scrollEnd();
    setTimeout(next, 90);
  })();
  function finish() {
    busy = false; showPrompt(true); render(); scrollEnd();
    // Show something real right away instead of an empty prompt
    setTimeout(() => typeOut("about", focusCli), reduce ? 0 : 400);
  }
}
render();
buildPlain();
// A link ending in #plain opens straight to the plain resume (handy for recruiters)
if (location.hash === "#plain") showPlain(true);
boot();
</script>
